name: CI / SonarCloud & GCP Preview

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  quality-check:
    name: Build, Lint & Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installation
        run: npm ci

      - name: 🛠️ Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: 🧹 Lint & Build
        run: |
          npm run lint || echo "Lint failed"
          npm run build:front
          npm run build:back

      - name: 📊 Analyse SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-preview:
    name: GCP Preview Deployment
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
            token_format: 'access_token'
            project_id: 'project-f676239d-0023-40fd-a9c'
            workload_identity_provider: 'projects/434930508478/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
            service_account: '434930508478-compute@developer.gserviceaccount.com'

      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
                registry: 'gcr.io'
                username: 'oauth2accesstoken'
                password: '${{ steps.auth.outputs.access_token }}'

      - name: 'Build and Push via Cloud Build'
        run: |
            cd frontend
            gcloud builds submit . \
              --config=<(echo '
              steps:
              - name: "gcr.io/cloud-builders/docker"
                args: ["build", "-t", "$_TAG", "--build-arg", "VITE_API_URL=$_VITE_API_URL", "."]
              images: ["$_TAG"]
              ') \
              --substitutions=_TAG="gcr.io/project-f676239d-0023-40fd-a9c/front-preview:pr-${{ github.event.number }}",_VITE_API_URL="${{ vars.VITE_API_URL }}"

      - name: 'Deploy to Cloud Run'
        id: deploy
        run: |
            gcloud run deploy deploy-front-develop \
              --image gcr.io/project-f676239d-0023-40fd-a9c/front-preview:pr-${{ github.event.number }} \
              --region europe-west1 \
              --tag pr-${{ github.event.number }} \
              --no-traffic \
              --allow-unauthenticated || \
            gcloud run deploy deploy-front-develop \
              --image gcr.io/project-f676239d-0023-40fd-a9c/front-preview:pr-${{ github.event.number }} \
              --region europe-west1 \
              --tag pr-${{ github.event.number }} \
              --allow-unauthenticated
            URL=$(gcloud run services describe deploy-front-develop --region europe-west1 --format='value(status.traffic)' | grep -oP "https://pr-${{ github.event.number }}---[^ ]+")
            echo "preview_url=$URL" >> $GITHUB_OUTPUT

      - name: 💬 Comment PR with Link
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.preview_url }}";
            if (url) {
              const header = `### 🚀 GCP Preview Deployment\n**Link:** [${url}](${url})\n\n---\n`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: header
              });
            }