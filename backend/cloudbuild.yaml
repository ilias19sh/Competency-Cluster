steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/front-dev', 
      '--build-arg', 'VITE_API_URL=${_VITE_API_URL}', 
      '-f', 'frontend/Dockerfile', 
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/front-dev']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mon-app-front-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/front-dev'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _VITE_API_URL: https://cda-back-434930508478.europe-west9.run.app